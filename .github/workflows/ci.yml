name: Global SMS Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis-and-lint:
    name: Code Quality & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Configure CI Environment Secrets
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Android Lint
        run: ./gradlew lintDebug --no-daemon --stacktrace

  unit-and-robolectric-tests:
    name: Unit & Robolectric Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Configure CI Environment Secrets
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit and Robolectric Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Publish Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-test-reports
          path: '**/build/reports/tests/**'

  build-and-package:
    name: Assemble Artifacts & Security Check
    needs: [static-analysis-and-lint, unit-and-robolectric-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Configure CI Environment Secrets
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK & Bundle
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlobalSMS-Enterprise-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
