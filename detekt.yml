build:
  maxIssues: 0
  excludeCorrectable: false

complexity:
  TooManyFunctions:
    active: false
  LargeClass:
    active: false

style:
  WildcardImport:
    active: false
  UnusedPrivateMember:
    active: true

naming:
  PackageNaming:
    active: true
    packagePattern: '^[a-z]+(\.[a-z][a-z0-9]*)*$'

exceptions:
  TooGenericExceptionCaught:
    active: false
